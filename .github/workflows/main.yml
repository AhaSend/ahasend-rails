name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}${{ matrix.mail && format(' / mail {0}', matrix.mail) }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        # One cell per Rails minor: "~> 8.0" alone would always resolve 8.1.
        rails: ["~> 7.0.0", "~> 7.1.0", "~> 7.2.0", "~> 8.0.0", "~> 8.1.0"]
        exclude:
          - { ruby: "3.4", rails: "~> 7.0.0" } # Rails 7.0 does not support Ruby 3.4
          - { ruby: "3.1", rails: "~> 8.0.0" } # Rails 8 needs Ruby 3.2+
          - { ruby: "3.1", rails: "~> 8.1.0" }
        include:
          # Oldest supported mail gem (common in Rails 7.0 lockfiles); Bundler
          # would otherwise always resolve the newest mail.
          - { ruby: "3.1", rails: "~> 7.0.0", mail: "~> 2.7.0" }
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      MAIL_VERSION: ${{ matrix.mail }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  # The gem must work with the plain mail gem and no Rails installed at all.
  plain-ruby:
    name: Plain Ruby ${{ matrix.ruby }} (no Rails)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.4"]
    env:
      BUNDLE_GEMFILE: gemfiles/plain_ruby.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec ruby -Ilib spec/scripts/plain_ruby.rb

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
